name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run marketplace:check
      - run: npm run typecheck
      - run: npm test
      - run: npm install --no-save --ignore-scripts bb-app@0.46.1
      - run: npm run build
